<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" href="assets/actorly-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js" integrity="sha384-B2WBjDzEjJpYvhmi2UyEn7rektqkf5suS6sNoyyrf0EBAwBHdkiXxIlU0V5Ru2ed" crossorigin="anonymous"></script>
<script src="./motion-kit.js"></script>
<style>
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
body{margin:0;background:#F2EFE9;color:#12100E;font-family:Archivo,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}a:hover{color:#A32C00}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
details[open] [data-plus]{transform:rotate(45deg)}
::selection{background:#FF4A1A;color:#12100E}
[data-mk-mask]{padding-bottom:.22em!important;margin-bottom:-.22em!important}
@keyframes blink{50%{opacity:0}}
@media (max-width:820px){[data-nav-links]{display:none!important}[data-nav-menu]{display:flex!important}}
</style>
</helmet>
<nav style="position:fixed; top:14px; left:0; right:0; z-index:60; padding:0 16px; pointer-events:none">
  <div style="pointer-events:auto; max-width:1080px; margin:0 auto; height:58px; background:rgba(255,255,255,.88); backdrop-filter:blur(14px); border-radius:999px; box-shadow:0 0 0 1px #DDD6CA, 0 20px 40px -24px rgba(18,16,14,.25); display:flex; align-items:center; gap:8px; padding:0 8px 0 20px">
    <a href="{{ homeHref }}" aria-label="Actorly home" style="display:flex; align-items:center; gap:9px; margin-right:12px; color:#12100E"><svg width="22" height="22" viewBox="0 0 48 48"><rect x="15" y="5" width="28" height="28" rx="7" fill="#12100E" opacity=".32"></rect><rect x="5" y="15" width="28" height="28" rx="7" fill="#FF4A1A"></rect><path d="M26.5 31 H13.5 M18 26.5 L13.5 31 L18 35.5" fill="none" stroke="#12100E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-weight:650; font-size:20px; letter-spacing:-.045em">actorly</span></a>
    <span data-nav-links style="display:flex; gap:2px; font-size:15px; font-weight:500">
      <a href="{{ howHref }}" style="padding:8px 12px; border-radius:999px" style-hover="background:#F2EFE9">How it works</a>
      <a href="Actorly Coverage.dc.html" style="padding:8px 12px; border-radius:999px; background:{{ covBg }}" style-hover="background:#F2EFE9">What it tracks</a>
      <a href="{{ pricingHref }}" style="padding:8px 12px; border-radius:999px" style-hover="background:#F2EFE9">Pricing</a>
      <a href="Actorly Docs.dc.html" style="padding:8px 12px; border-radius:999px; background:{{ docsBg }}" style-hover="background:#F2EFE9">Docs</a>
      <a href="Actorly Blog.dc.html" style="padding:8px 12px; border-radius:999px; background:{{ blogBg }}" style-hover="background:#F2EFE9">Blog</a>
    </span>
    <span style="flex:1"></span>
    <a href="{{ installHref }}" style="height:42px; padding:0 20px; border-radius:999px; background:#12100E; color:#F2EFE9; font-size:15px; font-weight:600; display:flex; align-items:center; gap:9px; white-space:nowrap" style-hover="background:#FF4A1A; color:#12100E"><span data-shopify-glyph-slot aria-hidden="true" style="display:inline-block; width:15px; height:15px; flex:none"></span>Install free</a>
    <button type="button" data-nav-menu aria-label="Menu" onClick="{{ toggle }}" style="display:none; width:42px; height:42px; border:0; border-radius:999px; background:#F2EFE9; align-items:center; justify-content:center; flex-direction:column; gap:5px; cursor:pointer"><span style="width:16px; height:2px; background:#12100E; transition:transform .3s cubic-bezier(.16,1,.3,1); transform:{{ bar1 }}"></span><span style="width:16px; height:2px; background:#12100E; transition:transform .3s cubic-bezier(.16,1,.3,1); transform:{{ bar2 }}"></span></button>
  </div>
  <div style="pointer-events:{{ sheetPe }}; max-width:1080px; margin:10px auto 0; background:#FFF; border-radius:26px; box-shadow:0 0 0 1px #DDD6CA, 0 30px 60px -20px rgba(18,16,14,.3); padding:14px; display:flex; flex-direction:column; opacity:{{ sheetOp }}; transform:translateY({{ sheetY }}px); transition:opacity .3s ease, transform .5s cubic-bezier(.16,1,.3,1)">
    <a href="{{ howHref }}" onClick="{{ close }}" style="padding:14px 12px; font-size:19px; font-weight:600; border-bottom:1px solid #EFEBE4">How it works</a>
    <a href="Actorly Coverage.dc.html" style="padding:14px 12px; font-size:19px; font-weight:600; border-bottom:1px solid #EFEBE4">What it tracks</a>
    <a href="{{ pricingHref }}" onClick="{{ close }}" style="padding:14px 12px; font-size:19px; font-weight:600; border-bottom:1px solid #EFEBE4">Pricing</a>
    <a href="Actorly Docs.dc.html" style="padding:14px 12px; font-size:19px; font-weight:600; border-bottom:1px solid #EFEBE4">Docs</a>
    <a href="Actorly Blog.dc.html" style="padding:14px 12px; font-size:19px; font-weight:600; border-bottom:1px solid #EFEBE4">Blog</a>
    <a href="Actorly Contact.dc.html" style="padding:14px 12px; font-size:19px; font-weight:600">Contact</a>
  </div>
  <div role="note" style="position:fixed; left:0; right:0; bottom:0; z-index:70; background:#12100E; color:#F2EFE9; font-size:13px; line-height:1.4; text-align:center; padding:7px 16px; pointer-events:none">Layout specimen. Placeholder copy, not published Actorly claims. Nothing here is live or can be installed or bought.</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;120px&quot;},&quot;home&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;coverage&quot;,&quot;docs&quot;,&quot;blog&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  componentDidMount() { this._esc = e => { if (e.key === 'Escape') this.setState({ open: false }); }; window.addEventListener('keydown', this._esc); }
  componentWillUnmount() { window.removeEventListener('keydown', this._esc); }
  renderVals() {
    const home = !!this.props.home, pre = home ? '' : 'Actorly Home.dc.html', cur = this.props.current || '', o = this.state.open;
    return {
      homeHref: home ? '#top' : 'Actorly Home.dc.html', howHref: pre + '#how', pricingHref: pre + '#pricing', installHref: pre + '#install',
      covBg: cur === 'coverage' ? '#F2EFE9' : 'transparent', docsBg: cur === 'docs' ? '#F2EFE9' : 'transparent', blogBg: cur === 'blog' ? '#F2EFE9' : 'transparent',
      toggle: () => this.setState(s => ({ open: !s.open })), close: () => this.setState({ open: false }),
      sheetOp: o ? 1 : 0, sheetY: o ? 0 : -8, sheetPe: o ? 'auto' : 'none',
      bar1: o ? 'translateY(3.5px) rotate(45deg)' : 'none', bar2: o ? 'translateY(-3.5px) rotate(-45deg)' : 'none'
    };
  }
}
</script>
</body>
</html>

<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radii" subtitle="Pills → stages → cards → stamps" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--paper)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:118px}.sw i{display:block;height:64px;border-radius:14px;box-shadow:var(--ring)}.sw b{display:block;font-size:13px;font-weight:600;margin-top:8px}.sw span{font-size:12px;color:var(--muted)}</style></head><body><div class="row" style="align-items:flex-end"><div><div style="width:160px;height:48px;background:var(--white);box-shadow:var(--ring);border-radius:var(--radius-pill)"></div><div style="font-size:12px;margin-top:6px"><b>pill</b> 999px</div></div><div><div style="width:120px;height:96px;background:var(--white);box-shadow:var(--ring);border-radius:var(--radius-stage)"></div><div style="font-size:12px;margin-top:6px"><b>stage</b> 28px</div></div><div><div style="width:110px;height:96px;background:var(--white);box-shadow:var(--ring);border-radius:var(--radius-card)"></div><div style="font-size:12px;margin-top:6px"><b>card</b> 24px</div></div><div><div style="width:100px;height:96px;background:var(--white);box-shadow:var(--ring);border-radius:var(--radius-tile)"></div><div style="font-size:12px;margin-top:6px"><b>tile</b> 20px</div></div><div><div style="width:90px;height:96px;background:var(--white);box-shadow:var(--ring);border-radius:var(--radius-inner)"></div><div style="font-size:12px;margin-top:6px"><b>inner</b> 14px</div></div><div><div style="width:80px;height:96px;background:var(--white);box-shadow:var(--ring);border-radius:var(--radius-stamp)"></div><div style="font-size:12px;margin-top:6px"><b>stamp</b> 12px</div></div></div></body></html>

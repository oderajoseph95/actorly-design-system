<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--paper)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:118px}.sw i{display:block;height:64px;border-radius:14px;box-shadow:var(--ring)}.sw b{display:block;font-size:13px;font-weight:600;margin-top:8px}.sw span{font-size:12px;color:var(--muted)}</style></head><body><div class="row"><span style="display:inline-block;padding:4px 11px;border-radius:12px;font-size:13px;font-weight:600;background:var(--confirmed-bg);color:var(--confirmed-fg)">Yes</span><span style="display:inline-block;padding:4px 11px;border-radius:12px;font-size:13px;font-weight:600;background:var(--likely-bg);color:var(--likely-fg)">Likely</span><span style="display:inline-block;padding:4px 11px;border-radius:12px;font-size:13px;font-weight:600;background:var(--unknown-bg);color:var(--unknown-fg)">Unknown</span><span style="display:inline-block;padding:4px 11px;border-radius:12px;font-size:13px;font-weight:600;background:var(--notyet-bg);color:var(--notyet-fg)">Not yet</span><span style="display:inline-block;padding:4px 11px;border-radius:12px;font-size:13px;font-weight:600;background:var(--notpossible-bg);color:var(--notpossible-fg)">Not possible</span><span style="display:inline-block;padding:4px 11px;border-radius:12px;font-size:13px;font-weight:600;background:var(--was-bg);color:var(--was-fg)"><s>Was $129.00</s></span><span style="display:inline-block;padding:4px 11px;border-radius:12px;font-size:13px;font-weight:600;background:var(--now-bg);color:var(--now-fg)">Now $89.00</span></div></body></html>

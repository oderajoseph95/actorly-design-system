<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;background:var(--paper)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:118px}.sw i{display:block;height:64px;border-radius:14px;box-shadow:var(--ring)}.sw b{display:block;font-size:13px;font-weight:600;margin-top:8px}.sw span{font-size:12px;color:var(--muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--ink)"></i><b>Ink</b><span>#12100E</span></div><div class="sw"><i style="background:var(--paper)"></i><b>Paper</b><span>#F2EFE9</span></div><div class="sw"><i style="background:var(--white)"></i><b>White</b><span>#FFFFFF</span></div><div class="sw"><i style="background:var(--ember)"></i><b>Ember</b><span>#FF4A1A</span></div><div class="sw"><i style="background:var(--ember-text)"></i><b>Ember text</b><span>#A32C00</span></div></div></body></html>
